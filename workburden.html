<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Work-Burden Analysis</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #22d3ee;
    --rent: #f97316;
    --tax: #a78bfa;
    --remain: #34d399;
    --border: #334155;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at top, #1e293b 0%, #0f172a 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 2rem 1rem;
    line-height: 1.5;
  }

  .wrap {
    max-width: 860px;
    margin: 0 auto;
  }

  h1 {
    font-size: 1.75rem;
    margin: 0 0 0.25rem;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .subtitle {
    color: var(--muted);
    margin: 0 0 2rem;
    font-size: 0.95rem;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-bottom: 0.35rem;
    color: var(--text);
  }

  .hint {
    font-weight: 400;
    color: var(--muted);
    font-size: 0.78rem;
  }

  input, select {
    width: 100%;
    padding: 0.6rem 0.75rem;
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    transition: border-color 0.15s;
  }

  input:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(56,189,248,0.15);
  }

  .actions {
    display: flex;
    gap: 0.75rem;
    margin-top: 1.25rem;
    flex-wrap: wrap;
  }

  button {
    padding: 0.7rem 1.25rem;
    border-radius: 8px;
    border: none;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.05s, filter 0.15s;
  }

  button:active { transform: translateY(1px); }

  .primary {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #0f172a;
  }

  .primary:hover { filter: brightness(1.08); }

  .secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }

  .secondary:hover { color: var(--text); border-color: var(--muted); }

  #results { display: none; }

  .results-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .results-header h2 {
    margin: 0;
    font-size: 1.2rem;
  }

  .tag {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: var(--card-2);
    color: var(--muted);
    padding: 0.25rem 0.6rem;
    border-radius: 999px;
    border: 1px solid var(--border);
  }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.25rem;
  }

  .stat {
    background: var(--card-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
  }

  .stat .label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
  }

  .stat .value {
    font-size: 1.25rem;
    font-weight: 700;
    margin-top: 0.15rem;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 0.5rem;
    font-size: 0.9rem;
  }

  th, td {
    text-align: right;
    padding: 0.55rem 0.5rem;
    border-bottom: 1px solid var(--border);
  }

  th:first-child, td:first-child { text-align: left; }

  th {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    font-weight: 600;
  }

  tr.total td {
    font-weight: 700;
    border-top: 2px solid var(--border);
    border-bottom: none;
  }

  .bar {
    height: 28px;
    border-radius: 6px;
    display: flex;
    overflow: hidden;
    margin: 1.25rem 0 0.5rem;
    border: 1px solid var(--border);
  }

  .bar span {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    color: #0f172a;
    white-space: nowrap;
    overflow: hidden;
    transition: width 0.4s ease;
  }

  .bar .rent { background: var(--rent); }
  .bar .tax { background: var(--tax); }
  .bar .remain { background: var(--remain); }

  .legend {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .legend .dot {
    display: inline-block;
    width: 10px; height: 10px;
    border-radius: 50%;
    margin-right: 0.35rem;
    vertical-align: middle;
  }

  .legend .rent .dot { background: var(--rent); }
  .legend .tax .dot { background: var(--tax); }
  .legend .remain .dot { background: var(--remain); }

  .narration {
    margin-top: 1.25rem;
    padding: 0.9rem 1rem;
    border-left: 3px solid var(--accent);
    background: rgba(56,189,248,0.06);
    border-radius: 0 8px 8px 0;
    font-style: italic;
    color: var(--text);
    font-size: 0.92rem;
  }

  .error {
    background: rgba(248,113,113,0.1);
    border: 1px solid #f87171;
    color: #fecaca;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    margin-top: 1rem;
    font-size: 0.9rem;
    display: none;
  }

  @media (max-width: 620px) {
    .bar span { font-size: 0.65rem; }
    table { font-size: 0.82rem; }
    th, td { padding: 0.45rem 0.3rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Work-Burden Analysis</h1>
  <p class="subtitle">See how many hours of your labor go to taxes, to your landlord, and to yourself.</p>

  <div class="card">
    <form id="input-form" novalidate>
      <div class="grid">
        <div>
          <label for="salary_type">Salary type</label>
          <select id="salary_type">
            <option value="hourly" selected>Hourly</option>
            <option value="annual">Annual</option>
          </select>
        </div>

        <div>
          <label for="salary">
            <span id="salary-label-text">Hourly wage ($)</span>
          </label>
          <input type="number" id="salary" step="0.01" min="0" value="26" required />
        </div>

        <div>
          <label for="hours_per_week">Hours per week <span class="hint">(e.g., 40)</span></label>
          <input type="number" id="hours_per_week" step="0.5" min="1" value="40" required />
        </div>

        <div>
          <label for="weeks_per_year">Weeks per year <span class="hint">(52 = full year)</span></label>
          <input type="number" id="weeks_per_year" step="1" min="1" max="52" value="52" required />
        </div>

        <div>
          <label for="shift_length">Shift length <span class="hint">(used in results table)</span></label>
          <select id="shift_length">
            <option value="8">8 hours</option>
            <option value="10">10 hours</option>
            <option value="12" selected>12 hours</option>
            <option value="custom">Custom…</option>
          </select>
        </div>

        <div id="custom-shift-wrap" style="display:none;">
          <label for="custom_shift">Custom shift length (hours)</label>
          <input type="number" id="custom_shift" step="0.5" min="1" max="24" value="12" />
        </div>

        <div>
          <label for="monthly_rent">Monthly rent ($)</label>
          <input type="number" id="monthly_rent" step="1" min="0" value="1700" required />
        </div>

        <div>
          <label for="dependents">Qualifying dependent children</label>
          <input type="number" id="dependents" step="1" min="0" value="1" required />
        </div>

        <div>
          <label for="filing_status">Filing status</label>
          <select id="filing_status">
            <option value="single" selected>Single</option>
            <option value="mfj">Married filing jointly</option>
          </select>
        </div>

        <div>
          <label for="state_tax_rate">
            State tax override <span class="hint">(blank = NM estimate)</span>
          </label>
          <input type="number" id="state_tax_rate" step="0.001" min="0" max="1" placeholder="e.g., 0.03" />
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="primary">Run analysis</button>
        <button type="button" class="secondary" id="reset-btn">Reset</button>
      </div>

      <div class="error" id="error-box"></div>
    </form>
  </div>

  <div class="card" id="results">
    <div class="results-header">
      <h2>Results</h2>
      <span class="tag" id="tag-filing">single · 1 dependent</span>
    </div>

    <div class="summary">
      <div class="stat">
        <div class="label">Hourly wage</div>
        <div class="value" id="out-hourly">—</div>
      </div>
      <div class="stat">
        <div class="label">Annual gross</div>
        <div class="value" id="out-annual">—</div>
      </div>
      <div class="stat">
        <div class="label">Monthly gross</div>
        <div class="value" id="out-monthly">—</div>
      </div>
      <div class="stat">
        <div class="label">Monthly hours</div>
        <div class="value" id="out-hours">—</div>
      </div>
    </div>

    <table>
      <thead>
        <tr id="table-head-row">
          <th>Obligation</th>
          <th>Monthly $</th>
          <th>Hours</th>
          <th>8-hr days</th>
          <th id="shift-col-header">12-hr shifts</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>

    <div class="bar" id="bar">
      <span class="rent" id="bar-rent">—</span>
      <span class="tax" id="bar-tax">—</span>
      <span class="remain" id="bar-remain">—</span>
    </div>
    <div class="legend">
      <span class="rent"><span class="dot"></span>Rent</span>
      <span class="tax"><span class="dot"></span>Taxes</span>
      <span class="remain"><span class="dot"></span>Remainder</span>
    </div>

    <div class="narration" id="narration"></div>
  </div>
</div>

<script>
/* =========================================================
   Core analysis function
   ========================================================= */
const EIGHT_HOUR_DAY = 8;

function analyzeWorkBurden({
  salary,
  salaryType = "hourly",
  hoursPerWeek = 40,
  weeksPerYear = 52,
  monthlyRent = 0,
  dependents = 0,
  filingStatus = "single",
  stateTaxRate = null,
  shiftLength = 12,
}) {
  // --- 1. Normalize to hourly wage and annual gross ---
  let annualGross, hourlyWage;
  if (salaryType === "annual") {
    annualGross = salary;
    const totalHours = hoursPerWeek * weeksPerYear;
    hourlyWage = totalHours ? annualGross / totalHours : 0;
  } else {
    hourlyWage = salary;
    annualGross = hourlyWage * hoursPerWeek * weeksPerYear;
  }

  const monthlyGross = annualGross / 12;
  const monthlyHours = (hoursPerWeek * weeksPerYear) / 12;

  // --- 2. FICA ---
  const SS_WAGE_BASE = 184500;
  const ssTaxable = Math.min(annualGross, SS_WAGE_BASE);
  const ficaAnnual = ssTaxable * 0.062 + annualGross * 0.0145;

  // --- 3. Federal income tax (2026 brackets) ---
  let standardDeduction, brackets;
  if (filingStatus === "single") {
    standardDeduction = 16100;
    brackets = [
      [12400, 0.10],
      [50400, 0.12],
      [105700, 0.22],
      [201775, 0.24],
      [256500, 0.32],
      [640600, 0.35],
      [Infinity, 0.37],
    ];
  } else {
    standardDeduction = 32200;
    brackets = [
      [24800, 0.10],
      [100800, 0.12],
      [211400, 0.22],
      [403550, 0.24],
      [513000, 0.32],
      [768700, 0.35],
      [Infinity, 0.37],
    ];
  }

  const taxableIncome = Math.max(0, annualGross - standardDeduction);
  let federalTax = 0;
  let prevLimit = 0;
  for (const [limit, rate] of brackets) {
    if (taxableIncome > prevLimit) {
      federalTax += (Math.min(taxableIncome, limit) - prevLimit) * rate;
      prevLimit = limit;
    } else break;
  }

  // Child Tax Credit (2026: $2,200 per child)
  let ctc = 0;
  if (dependents > 0) {
    const phaseOutThreshold = filingStatus === "single" ? 200000 : 400000;
    const excess = Math.max(0, annualGross - phaseOutThreshold);
    const reduction = Math.floor(excess / 1000) * 50;
    ctc = Math.max(0, dependents * 2200 - reduction);
  }
  const federalTaxNet = Math.max(0, federalTax - ctc);

  // --- 4. State income tax ---
  let stateTaxAnnual;
  if (stateTaxRate === null || stateTaxRate === undefined || isNaN(stateTaxRate)) {
    if (filingStatus === "single") {
      stateTaxAnnual = Math.max(0, annualGross - 19000) * 0.043;
    } else {
      stateTaxAnnual = Math.max(0, annualGross - 38000) * 0.043;
    }
  } else {
    stateTaxAnnual = annualGross * stateTaxRate;
  }

  // --- 5. Monthly totals ---
  const monthlyFica = ficaAnnual / 12;
  const monthlyFederal = federalTaxNet / 12;
  const monthlyState = stateTaxAnnual / 12;
  const monthlyTaxTotal = monthlyFica + monthlyFederal + monthlyState;
  const monthlyRemainder = monthlyGross - monthlyTaxTotal - monthlyRent;

  // --- 6. Convert to hours, 8-hr days, and chosen shifts ---
  const hoursFor = (cost) => (hourlyWage ? cost / hourlyWage : Infinity);
  const hoursTaxes = hoursFor(monthlyTaxTotal);
  const hoursRent = hoursFor(monthlyRent);
  const hoursRemainder = hoursFor(monthlyRemainder);

  // Distribute tax hours across components proportionally
  const taxShare = (amount) =>
    monthlyTaxTotal > 0 ? amount / monthlyTaxTotal : 0;
  const componentHours = (amount) => hoursTaxes * taxShare(amount);

  return {
    hourlyWage,
    annualGross,
    monthlyGross,
    monthlyHours,
    shiftLength,
    monthlyFica,
    monthlyFederal,
    monthlyState,
    monthlyTaxTotal,
    monthlyRent,
    monthlyRemainder,
    hoursTaxes,
    hoursRent,
    hoursRemainder,
    // 8-hour days
    daysFica: componentHours(monthlyFica) / EIGHT_HOUR_DAY,
    daysFederal: componentHours(monthlyFederal) / EIGHT_HOUR_DAY,
    daysState: componentHours(monthlyState) / EIGHT_HOUR_DAY,
    daysTaxes: hoursTaxes / EIGHT_HOUR_DAY,
    daysRent: hoursRent / EIGHT_HOUR_DAY,
    daysRemainder: hoursRemainder / EIGHT_HOUR_DAY,
    // chosen-length shifts
    shiftsFica: componentHours(monthlyFica) / shiftLength,
    shiftsFederal: componentHours(monthlyFederal) / shiftLength,
    shiftsState: componentHours(monthlyState) / shiftLength,
    shiftsTaxes: hoursTaxes / shiftLength,
    shiftsRent: hoursRent / shiftLength,
    shiftsRemainder: hoursRemainder / shiftLength,
  };
}

/* =========================================================
   UI logic
   ========================================================= */
const $ = (id) => document.getElementById(id);

const fmtMoney = (n) =>
  "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const fmtMoneyShort = (n) =>
  "$" + Math.round(n).toLocaleString("en-US");

const fmtHours = (n) =>
  (isFinite(n) ? n.toFixed(1) : "∞");

const fmtDays = (n) =>
  (isFinite(n) ? n.toFixed(2) : "∞");

const fmtShifts = (n) =>
  (isFinite(n) ? n.toFixed(2) : "∞");

$("salary_type").addEventListener("change", (e) => {
  const isHourly = e.target.value === "hourly";
  $("salary-label-text").textContent = isHourly ? "Hourly wage ($)" : "Annual salary ($)";
  $("salary").value = isHourly ? "26" : "54080";
});

// Show/hide custom shift input when the dropdown changes
$("shift_length").addEventListener("change", (e) => {
  const isCustom = e.target.value === "custom";
  $("custom-shift-wrap").style.display = isCustom ? "block" : "none";
});

function showError(msg) {
  const box = $("error-box");
  box.textContent = msg;
  box.style.display = "block";
}

function clearError() {
  const box = $("error-box");
  box.textContent = "";
  box.style.display = "none";
}

$("input-form").addEventListener("submit", (e) => {
  e.preventDefault();
  clearError();

  const salaryType = $("salary_type").value;
  const salary = parseFloat($("salary").value);
  const hoursPerWeek = parseFloat($("hours_per_week").value);
  const weeksPerYear = parseFloat($("weeks_per_year").value);
  const monthlyRent = parseFloat($("monthly_rent").value);
  const dependents = parseInt($("dependents").value, 10);
  const filingStatus = $("filing_status").value;
  const stateRaw = $("state_tax_rate").value.trim();
  const stateTaxRate = stateRaw === "" ? null : parseFloat(stateRaw);

  // Resolve shift length
  const shiftChoice = $("shift_length").value;
  const shiftLength =
    shiftChoice === "custom"
      ? parseFloat($("custom_shift").value)
      : parseFloat(shiftChoice);

  const errors = [];
  if (!isFinite(salary) || salary < 0) errors.push("Salary must be a non-negative number.");
  if (!isFinite(hoursPerWeek) || hoursPerWeek <= 0) errors.push("Hours per week must be greater than 0.");
  if (!isFinite(weeksPerYear) || weeksPerYear <= 0 || weeksPerYear > 52)
    errors.push("Weeks per year must be between 1 and 52.");
  if (!isFinite(monthlyRent) || monthlyRent < 0) errors.push("Rent must be a non-negative number.");
  if (!Number.isInteger(dependents) || dependents < 0) errors.push("Dependents must be a non-negative integer.");
  if (stateTaxRate !== null && (!isFinite(stateTaxRate) || stateTaxRate < 0 || stateTaxRate > 1))
    errors.push("State tax rate must be between 0 and 1 (e.g., 0.03 for 3%).");
  if (!isFinite(shiftLength) || shiftLength <= 0 || shiftLength > 24)
    errors.push("Shift length must be between 0 and 24 hours.");

  if (errors.length) {
    showError(errors.join(" "));
    return;
  }

  const r = analyzeWorkBurden({
    salary,
    salaryType,
    hoursPerWeek,
    weeksPerYear,
    monthlyRent,
    dependents,
    filingStatus,
    stateTaxRate,
    shiftLength,
  });

  // --- Summary stats ---
  $("tag-filing").textContent =
    (filingStatus === "single" ? "single" : "married filing jointly") +
    " · " +
    dependents +
    " dependent" + (dependents === 1 ? "" : "s") +
    " · " +
    shiftLength +
    "-hr shifts";

  $("out-hourly").textContent = fmtMoney(r.hourlyWage);
  $("out-annual").textContent = fmtMoneyShort(r.annualGross);
  $("out-monthly").textContent = fmtMoneyShort(r.monthlyGross);
  $("out-hours").textContent = r.monthlyHours.toFixed(1) + " hrs";

  // --- Decide whether to show both columns ---
  const showBothColumns = Math.abs(shiftLength - EIGHT_HOUR_DAY) > 0.001;
  const headRow = $("table-head-row");

  headRow.innerHTML = showBothColumns
    ? `<th>Obligation</th>
       <th>Monthly $</th>
       <th>Hours</th>
       <th>8-hr days</th>
       <th>${shiftLength}-hr shifts</th>`
    : `<th>Obligation</th>
       <th>Monthly $</th>
       <th>Hours</th>
       <th>${shiftLength}-hr shifts</th>`;

  // --- Table rows: [label, cost, hours, days, shifts, isTotal] ---
  const rows = [
    ["FICA", r.monthlyFica, r.monthlyFica / r.hourlyWage, r.daysFica, r.shiftsFica],
    ["Federal income tax", r.monthlyFederal, r.monthlyFederal / r.hourlyWage, r.daysFederal, r.shiftsFederal],
    ["State income tax", r.monthlyState, r.monthlyState / r.hourlyWage, r.daysState, r.shiftsState],
    ["Total taxes", r.monthlyTaxTotal, r.hoursTaxes, r.daysTaxes, r.shiftsTaxes, true],
    ["Rent", r.monthlyRent, r.hoursRent, r.daysRent, r.shiftsRent],
    ["Remainder", r.monthlyRemainder, r.hoursRemainder, r.daysRemainder, r.shiftsRemainder, true],
  ];

  const tbody = $("table-body");
  tbody.innerHTML = "";
  for (const [label, cost, hrs, days, shifts, isTotal] of rows) {
    const tr = document.createElement("tr");
    if (isTotal) tr.classList.add("total");

    const cells = [
      `<td>${label}</td>`,
      `<td>${fmtMoney(cost)}</td>`,
      `<td>${fmtHours(hrs)}</td>`,
    ];
    if (showBothColumns) {
      cells.push(`<td>${fmtDays(days)}</td>`);
    }
    cells.push(`<td>${fmtShifts(shifts)}</td>`);

    tr.innerHTML = cells.join("");
    tbody.appendChild(tr);
  }

  // --- Bar chart ---
  const total = r.monthlyTaxTotal + r.monthlyRent + Math.max(0, r.monthlyRemainder);
  const pct = (v) => (total > 0 ? (v / total) * 100 : 0);
  const rentPct = pct(r.monthlyRent);
  const taxPct = pct(r.monthlyTaxTotal);
  const remainPct = pct(Math.max(0, r.monthlyRemainder));

  $("bar-rent").style.width = rentPct + "%";
  $("bar-tax").style.width = taxPct + "%";
  $("bar-remain").style.width = remainPct + "%";

  $("bar-rent").textContent = rentPct > 12 ? rentPct.toFixed(0) + "%" : "";
  $("bar-tax").textContent = taxPct > 12 ? taxPct.toFixed(0) + "%" : "";
  $("bar-remain").textContent = remainPct > 12 ? remainPct.toFixed(0) + "%" : "";

  // --- Narration ---
  const landlordHours = r.hoursRent;
  const taxHours = r.hoursTaxes;
  const selfHours = r.hoursRemainder;

  let narration = "";
  if (landlordHours > selfHours) {
    narration =
      `This person works <strong>${landlordHours.toFixed(1)} hours</strong> per month for their landlord — ` +
      `more than the <strong>${selfHours.toFixed(1)} hours</strong> left over for themselves after taxes and rent. ` +
      `That's <strong>${r.daysRent.toFixed(2)} eight-hour days</strong>` +
      (showBothColumns
        ? ` (or <strong>${r.shiftsRent.toFixed(2)} ${shiftLength}-hour shifts</strong>)`
        : "") +
      ` to the landlord, versus <strong>${r.daysTaxes.toFixed(2)}</strong> eight-hour days` +
      (showBothColumns
        ? ` (or <strong>${r.shiftsTaxes.toFixed(2)}</strong> ${shiftLength}-hour shifts)`
        : "") +
      ` to taxes.`;
  } else {
    narration =
      `This person works <strong>${landlordHours.toFixed(1)} hours</strong> per month for their landlord, ` +
      `<strong>${taxHours.toFixed(1)} hours</strong> for taxes, and keeps <strong>${selfHours.toFixed(1)} hours</strong> ` +
      `for themselves. In eight-hour days that's <strong>${r.daysRent.toFixed(2)}</strong> for the landlord and ` +
      `<strong>${r.daysTaxes.toFixed(2)}</strong> for taxes` +
      (showBothColumns
        ? `; in ${shiftLength}-hour shifts it's <strong>${r.shiftsRent.toFixed(2)}</strong> and <strong>${r.shiftsTaxes.toFixed(2)}</strong>.`
        : `.`);
  }
  $("narration").innerHTML = narration;

  $("results").style.display = "block";
  $("results").scrollIntoView({ behavior: "smooth", block: "start" });
});

$("reset-btn").addEventListener("click", () => {
  $("input-form").reset();
  $("salary_type").value = "hourly";
  $("salary-label-text").textContent = "Hourly wage ($)";
  $("salary").value = "26";
  $("hours_per_week").value = "40";
  $("weeks_per_year").value = "52";
  $("shift_length").value = "12";
  $("custom-shift-wrap").style.display = "none";
  $("custom_shift").value = "12";
  $("monthly_rent").value = "1700";
  $("dependents").value = "1";
  $("filing_status").value = "single";
  $("state_tax_rate").value = "";
  clearError();
  $("results").style.display = "none";
});
</script>
</body>
</html>
